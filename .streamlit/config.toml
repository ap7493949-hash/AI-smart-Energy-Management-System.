[theme]
primaryColor = "#0096DC"
backgroundColor = "#0a0e14"
secondaryBackgroundColor = "#1a1f2e"
textColor = "#ffffff"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "viewer"

[server]
headless = true
port = 8501
runOnSave = true
enableXsrfProtection = true

[logger]
level = "info"

[ui]
hideTopBar = false
hideFooter = false
